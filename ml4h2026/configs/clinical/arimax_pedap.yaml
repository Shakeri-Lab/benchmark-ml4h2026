eval:
  evaluation:
    compile: false
  model_data:
    dataloader:
      batch_size: 64
      history_len: 96
      nocturnal_end_hour: 6
      nocturnal_start_hour: 0
      num_workers: 0
      pred_len: 12
      shuffle: true
      stride: 12
      univariate: false
    model:
      name: arimax
      params:
        boundary_gap_len: 1
        drop_static_exog: true
        enforce_invertibility: true
        enforce_stationarity: true
        fit_maxiter: 10000
        fit_sample_limit: 1000
        fit_sample_seed: 42
        fit_strategy: global
        future_exog_strategy: auto
        normalize_insulin_by_weight: false
        order:
        - 2
        - 0
        - 1
        trend: c
        univariate: false
    seed: 42
  notes: Best arimax on pedap (12 steps)
  split:
    processed_root: datasets_processed
    split_name: pedap_patients_70_10_20_seed42
    split_part: test
    split_root: configs/preprocessing
    train_part: train
    val_part: val
model: arimax
train:
  model_data:
    dataloader:
      batch_size: 64
      history_len: 96
      nocturnal_end_hour: 6
      nocturnal_start_hour: 0
      num_workers: 0
      pred_len: 12
      shuffle: true
      stride: 12
      univariate: false
    model:
      name: arimax
      params:
        boundary_gap_len: 1
        drop_static_exog: true
        enforce_invertibility: true
        enforce_stationarity: true
        fit_maxiter: 10000
        fit_sample_limit: 1000
        fit_sample_seed: 42
        fit_strategy: global
        future_exog_strategy: auto
        normalize_insulin_by_weight: false
        order:
        - 2
        - 0
        - 1
        trend: c
        univariate: false
    seed: 42
  notes: Best arimax on pedap (12 steps)
  split:
    processed_root: datasets_processed
    split_name: pedap_patients_70_10_20_seed42
    split_root: configs/preprocessing
    train_part: train
    val_part: val
  training:
    amp: false
    compile: false
    early_stopping:
      min_delta: 0.01
      patience: 5
    epochs: 30
    grad_clip_norm: null
    loss: mse
    optimizer:
      lr: 0.0001
      name: adam
      weight_decay: 0.0
    scheduler:
      min_lr: 1.0e-06
      name: reduce_on_plateau
      patience: 2
