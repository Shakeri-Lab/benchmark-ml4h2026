eval:
  evaluation:
    compile: false
    event_thresholds:
      nocturnal: 0
      post_bolus: 3
      post_meal: 3
    metrics:
    - rmse
    - mae
    - seg
    - gmse
    - grmse
    - ceg_ratio
    - peg_ratio
    - seg_z_ratio
  model_data:
    dataloader:
      batch_size: 64
      feature_cols:
      - cgm
      - basal
      - bolus
      history_len: 96
      nocturnal_end_hour: 6
      nocturnal_start_hour: 0
      num_workers: 0
      pred_len: 48
      shuffle: false
      stride: 48
      univariate: false
    model:
      name: dlinear
      params:
        individual: false
        univariate: false
    seed: 42
  notes: Counterfactual eval config for dlinear on action_cf_benchmark_controliq;
    selected from 026 with val_rmse=33.824799
  split:
    processed_root: datasets_processed
    split_name: action_cf_controliq_4h
    split_part: test
model: dlinear
train:
  model_data:
    dataloader:
      batch_size: 64
      feature_cols:
      - cgm
      - basal
      - bolus
      history_len: 96
      nocturnal_end_hour: 6
      nocturnal_start_hour: 0
      num_workers: 0
      pred_len: 48
      shuffle: true
      stride: 48
      univariate: false
    model:
      name: dlinear
      params:
        individual: false
        univariate: false
    seed: 42
  notes: 'Counterfactual best config: dlinear on action_cf_benchmark_controliq; selected
    from 026 with val_rmse=33.824799'
  split:
    processed_root: datasets_processed
    split_name: action_cf_controliq_4h
    split_root: configs/preprocessing
    train_part: train
    val_part: val
  training:
    amp: false
    compile: false
    early_stopping:
      min_delta: 0.01
      patience: 5
    epochs: 30
    grad_clip_norm: 1.0
    loss: mse
    optimizer:
      betas:
      - 0.9
      - 0.999
      eps: 1.0e-08
      lr: 0.0005
      name: adam
      weight_decay: 0.0
    scheduler:
      factor: 0.5
      min_lr: 1.0e-06
      name: reduce_on_plateau
      patience: 2
