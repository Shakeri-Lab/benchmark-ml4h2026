evaluation:
  compile: false
  event_thresholds:
    nocturnal: 0
    post_bolus: 3
    post_meal: 3
  metrics:
  - rmse
  - mae
  - seg
  - gmse
  - grmse
  - ceg_ratio
  - peg_ratio
  - seg_z_ratio
model_data:
  dataloader:
    batch_size: 128
    feature_cols:
    - cgm
    - basal
    - bolus
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 48
    shuffle: false
    stride: 48
    univariate: false
  model:
    name: itransformer
    params:
      activation: gelu
      class_strategy: projection
      d_ff: 256
      d_model: 128
      dropout: 0.1
      e_layers: 3
      embed: timeF
      factor: 1
      freq: h
      n_heads: 8
      output_attention: false
      univariate: false
      use_norm: true
  seed: 42
notes: Counterfactual eval config for itransformer on action_cf_benchmark_controliq;
  selected from 061 with val_rmse=11.489114
split:
  processed_root: datasets_processed
  split_name: action_cf_benchmark_controliq
  split_part: test
