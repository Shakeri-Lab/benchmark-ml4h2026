model_data:
  dataloader:
    batch_size: 128
    history_len: 48
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 9
    shuffle: true
    stride: 9
    univariate: false
  model:
    name: zoh
    params:
      univariate: false
  seed: 42
notes: Best zoh on shanghait1dm (9 steps)
split:
  processed_root: datasets_processed
  split_name: shanghait1dm_patients_70_10_20_seed42
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.0
    patience: 1
  epochs: 1
  grad_clip_norm: null
  loss: mse
  optimizer:
    lr: 0.0001
    name: adam
    weight_decay: 0.0
  scheduler:
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
