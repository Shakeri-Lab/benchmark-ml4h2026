split:
  processed_root: datasets_processed
  split_name: pedap_patients_70_10_20_seed42
  split_root: configs/preprocessing
  train_part: train
  val_part: val
model_data:
  seed: 42
  model:
    name: arimax
    params:
      boundary_gap_len: 1
      enforce_invertibility: false
      enforce_stationarity: false
      fit_maxiter: 10000
      fit_sample_limit: 2000
      fit_sample_seed: 42
      fit_strategy: global
      future_exog_strategy: zeros
      order:
      - 2
      - 1
      - 1
      trend: c
      univariate: false
  dataloader:
    batch_size: 64
    history_len: 48
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 12
    shuffle: true
    stride: 12
    univariate: false
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  grad_clip_norm: null
  loss: mse
  optimizer:
    lr: 0.0001
    name: adam
    weight_decay: 0.0
  scheduler:
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
notes: Rerun of best_arimax_pedap_p12 training config
