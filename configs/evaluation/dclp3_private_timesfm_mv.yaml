split:
  split_name: dclp3-private_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  split_part: test

model_data:
  seed: 42
  model:
    name: timesfm
    params:
      model_id: google/timesfm-2.5-200m-pytorch
      max_context: 288
      max_horizon: 288
      normalize_inputs: true
      device: cuda
      univariate: false
  dataloader:
    history_len: 288
    pred_len: 12
    stride: 12
    batch_size: 256
    univariate: false
    num_workers: 0
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6

evaluation:
  metrics: ["rmse", "mae", "seg", "gmse", "grmse", "ceg_ratio", "peg_ratio", "seg_z_ratio"]
  compile: false
  event_thresholds:
    post_meal: 3
    post_bolus: 3
    nocturnal: 0

notes: "Evaluate multivariate TimesFM on private DCLP3"
