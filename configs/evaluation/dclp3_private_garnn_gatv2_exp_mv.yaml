split:
  split_name: dclp3-private_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  split_part: test

model_data:
  seed: 42
  model:
    name: garnn_gatv2_exp
    params:
      hidden_dim: 512
      nhead: 1
      num_layers: 2
      all_edges: true
      alpha: 0.2
      univariate: false
  dataloader:
    history_len: 48
    pred_len: 12
    stride: 12
    batch_size: 128
    univariate: false
    num_workers: 0
    target_horizon: -1
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6

evaluation:
  metrics: ["rmse", "mae", "seg", "gmse", "grmse", "ceg_ratio", "peg_ratio", "seg_z_ratio"]
  compile: false
  event_thresholds:
    post_meal: 3
    post_bolus: 3
    nocturnal: 0

notes: "Evaluate multivariate GARNN gatv2_exp on private DCLP3"
