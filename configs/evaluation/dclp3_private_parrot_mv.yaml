split:
  split_name: dclp3-private_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  split_part: test

model_data:
  seed: 42
  model:
    name: parrot
    params:
      D: 36             #set D to at most 1/4 of the context/history len
      tau: 1
      context_len: 144
      univariate: true
  dataloader:
    history_len: 144
    pred_len: 12
    stride: 12
    batch_size: 128
    univariate: true
    num_workers: 0
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6

evaluation:
  metrics: ["rmse", "mae", "seg", "gmse", "grmse", "ceg_ratio", "peg_ratio", "seg_z_ratio"]
  compile: false
  event_thresholds:
    post_meal: 3
    post_bolus: 3
    nocturnal: 0

notes: "Evaluate Parrot zero-shot on private DCLP3"
