split:
  split_name: dclp3-private_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  split_part: test

model_data:
  seed: 42
  model:
    name: grupp
    params:
      hidden_size: 16
      num_layers: 2
      dropout: 0.0
      bidirectional: True
      use_layernorm: True
      head_type: linear
      head_hidden_dim: 32
      head_num_layers: 2
      decomposition_kernel_size: 25
      revin_eps: 1.0e-6
      univariate: false
  dataloader:
    history_len: 48
    pred_len: 12
    stride: 12
    batch_size: 128
    univariate: false
    num_workers: 0
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6

evaluation:
  metrics: ["rmse", "mae", "seg", "gmse", "grmse", "ceg_ratio", "peg_ratio", "seg_z_ratio"]
  compile: false
  event_thresholds:
    post_meal: 3
    post_bolus: 3
    nocturnal: 0

notes: "Evaluate multivariate GRUPP on private DCLP3"
