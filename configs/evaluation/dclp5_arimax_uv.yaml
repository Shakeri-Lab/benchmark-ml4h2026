split:
  split_name: dclp5_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  split_part: test
model_data:
  seed: 42
  model:
    name: arimax
    params:
      order:
      - 2
      - 1
      - 2
      trend: c
      enforce_stationarity: false
      enforce_invertibility: false
      fit_strategy: global
      future_exog_strategy: zeros
      boundary_gap_len: 1
      univariate: true
  dataloader:
    history_len: 48
    pred_len: 12
    stride: 12
    batch_size: 64
    univariate: true
    num_workers: 0
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
evaluation:
  metrics:
  - rmse
  - mae
  - seg
  - gmse
  - grmse
  - ceg_ratio
  - peg_ratio
  - seg_z_ratio
  compile: false
  event_thresholds:
    post_meal: 3
    post_bolus: 3
    nocturnal: 0
notes: Univariate arimax on DCLP5
