split:
  processed_root: datasets_processed
  split_name: action_cf_benchmark_bolus
  split_root: configs/preprocessing
  split_part: test
model_data:
  dataloader:
    batch_size: 64
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 24
    shuffle: false
    stride: 24
    univariate: false
  model:
    name: gru
    params:
      bidirectional: false
      dropout: 0.0
      head_hidden_dim: 32
      head_num_layers: 2
      head_type: linear
      hidden_size: 32
      num_layers: 2
      univariate: false
      use_layernorm: true
  seed: 42
evaluation:
  metrics:
  - rmse
  - mae
  - seg
  - gmse
  - grmse
  - ceg_ratio
  - peg_ratio
  - seg_z_ratio
  event_thresholds:
    post_meal: 3
    post_bolus: 3
    nocturnal: 0
  compile: false
notes: Policy-regret eval config for gru on action_cf_benchmark_bolus; selected from
  039 with val_rmse=7.441407
