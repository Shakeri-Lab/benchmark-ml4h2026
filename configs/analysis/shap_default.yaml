data:
  # Path to the split CSV (overridable via CLI --split_path).
  # Example below matches the repo's split output convention.
  split_path: datasets_processed/DCLP3-private/splits/dclp3-private_patients_70_10_20_seed42/test.csv

  # Which split partition from the split spec to evaluate/explain.
  split_part: test

  # All units in this config are "steps" (1 step = 5 minutes).
  history_len: 48
  pred_len: 12
  stride: 12
  batch_size: 64
  univariate: false
  num_workers: 0
  processed_root: datasets_processed
  input_layout: BTC

  # Used for nocturnal slice labeling from ctx_end_date (hour parsing).
  nocturnal_start_hour: 0
  nocturnal_end_hour: 6

shap:
  # Horizons to explain (steps ahead). Must be within pred_len.
  horizons_steps: [3, 6, 12]

  # Permutation SHAP Monte Carlo parameters.
  n_permutations: 16
  n_background_draws: 16
  microbatch_size: 64
  seed: 42

  # If true, resample K backgrounds per permutation (more MC, more compute).
  resample_background_each_permutation: false

background:
  # Pool policy: per-patient, prefer same slice if enough background windows exist.
  prefer_same_slice: true
  min_pool_size_same_slice: 25
  allow_global_fallback: false
  global_prefer_same_slice: false
  exclude_self: false

  # Optional caps to keep memory bounded (null = no cap).
  max_per_pid_slice: null
  max_per_pid: null
  max_global: null

output:
  partition_by_slice: true
  file_format: npz
  max_eval_samples: null
  diagnostics_subset_size: 128

model:
  # Optional model compilation (torch.compile).
  # Accepts bool or dict: {enabled: true, mode: default, backend: inductor, fullgraph: false, dynamic: false}
  compile: false

# Optional: explicitly map feature columns to modalities.
# If omitted, a heuristic is used based on substrings in column names.
# modality_channels:
#   cgm: ["cgm"]
#   meal: ["meal"]
#   bolus: ["bolus"]
#   basal: ["basal"]

# Optional: override the default recency windows per modality (in steps).
# Defaults (if omitted):
#   cgm:   [[0,3],[3,6],[6,12],[12,24]]
#   meal:  [[0,3],[3,6],[6,12]]
#   bolus: [[0,3],[3,6],[6,12]]
#   basal: [[0,6],[6,12]]
#   activity: [[0,6],[6,12],[12,24]]
# windows_steps_by_modality:
#   cgm: [[0,3],[3,6],[6,12],[12,24]]
