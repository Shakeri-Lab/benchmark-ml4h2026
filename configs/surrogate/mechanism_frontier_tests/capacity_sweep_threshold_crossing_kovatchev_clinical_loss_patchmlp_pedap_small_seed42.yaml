model_data:
  dataloader:
    batch_size: 64
    history_len: 144
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 12
    shuffle: true
    stride: 12
    univariate: false
    target_col: cgm
  model:
    name: patchmlp
    params:
      d_model: 128
      e_layers: 2
      output_attention: false
      univariate: false
      use_norm: false
  seed: 42
notes: Mechanism-frontier PatchMLP config for PEDAP with threshold_crossing_kovatchev_clinical_loss.
  Uses 12 h history, 1 h prediction, stride 12, and single-lag 30 min evaluation downstream.
split:
  processed_root: datasets_processed
  split_name: pedap_patients_70_10_20_seed42
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  grad_clip_norm: 1.0
  loss: threshold_crossing_kovatchev_clinical_loss
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0005
    name: adamw
    weight_decay: 0.0
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
  loss_params:
    fitted_loss_config: configs/surrogate/fitted_threshold_crossing_kovatchev_default.yaml
    value_scale: mg/dL
    assert_mgdl_scale: true
surrogate:
  stage: mechanism_frontier_tests
  dataset: PEDAP
  model_architecture: patchmlp
mechanism_frontier:
  stage: mechanism_frontier_tests
  dataset: PEDAP
  model_architecture: patchmlp
  loss_key: threshold_crossing_kovatchev_clinical_loss
  seed: 42
  history_hours: 12
  prediction_minutes: 60
  decision_horizon_minutes: 30
  decision_horizon_index_zero_based: 5
  loss_space: mg/dL
  capacity: small
  capacity_multiplier: 0.25
