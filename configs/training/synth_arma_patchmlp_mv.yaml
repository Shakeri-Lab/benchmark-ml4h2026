split:
  split_name: synth_arma_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  train_part: train
  val_part: val
training:
  epochs: 30
  loss: mse
  amp: false
  grad_clip_norm: 1.0
  compile: false
  early_stopping:
    patience: 5
    min_delta: 0.01
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    name: reduce_on_plateau
    min_lr: 1.0e-06
    patience: 2
    factor: 0.5
model_data:
  seed: 42
  model:
    name: patchmlp
    params:
      d_model: 1024
      e_layers: 1
      use_norm: true
      output_attention: false
      univariate: false
  dataloader:
    history_len: 48
    pred_len: 12
    stride: 12
    batch_size: 128
    univariate: false
    num_workers: 0
    shuffle: true
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
notes: patchmlp multivariate on synth_arma
