split:
  split_name: dclp5_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  train_part: train
  val_part: val
training:
  epochs: 30
  loss: mse
  amp: false
  grad_clip_norm: 1.0
  early_stopping:
    patience: 5
    min_delta: 0.01
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    name: reduce_on_plateau
    min_lr: 1.0e-06
    patience: 2
    factor: 0.5
model_data:
  seed: 42
  model:
    name: itransformer
    params:
      d_model: 64
      n_heads: 4
      e_layers: 2
      d_ff: 128
      dropout: 0.1
      factor: 1
      activation: gelu
      embed: timeF
      freq: h
      output_attention: false
      use_norm: true
      class_strategy: projection
      univariate: false
  dataloader:
    history_len: 48
    pred_len: 6
    stride: 6
    batch_size: 128
    univariate: false
    num_workers: 0
    shuffle: false
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
notes: '30min horizon: Multivariate itransformer on DCLP5'
