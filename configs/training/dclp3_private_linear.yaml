split:
  split_name: dclp3-private_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  train_part: train
  val_part: val
training:
  epochs: 30
  loss: mse
  amp: false
  grad_clip_norm: 1.0
  early_stopping:
    patience: 5
    min_delta: 0.01
  optimizer:
    name: adamw
    lr: 2.0e-05
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    name: reduce_on_plateau
    min_lr: 1.0e-06
    patience: 2
    factor: 0.5
model_data:
  seed: 42
  model:
    name: linear_regression
    params: {}
  dataloader:
    history_len: 24
    pred_len: 12
    stride: 12
    batch_size: 256
    univariate: true
    num_workers: 0
    shuffle: false
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
notes: Linear regression on private DCLP3