split:
  split_name: dclp3_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  train_part: train
  val_part: val
training:
  epochs: 30
  loss: mse
  amp: false
  grad_clip_norm: null
  compile: false
  early_stopping:
    patience: 5
    min_delta: 0.01
  optimizer:
    name: adam
    lr: 0.0001
    weight_decay: 0.0
  scheduler:
    name: reduce_on_plateau
    patience: 2
    min_lr: 1.0e-06
model_data:
  seed: 42
  model:
    name: arimax
    params:
      order:
      - 2
      - 1
      - 2
      trend: c
      fit_maxiter: 10000
      enforce_stationarity: false
      enforce_invertibility: false
      fit_strategy: global
      fit_sample_limit: 2000
      fit_sample_seed: 42
      future_exog_strategy: zeros
      boundary_gap_len: 1
      univariate: true
  dataloader:
    history_len: 48
    pred_len: 6
    stride: 6
    batch_size: 64
    univariate: true
    num_workers: 0
    shuffle: true
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
notes: '30min horizon: Univariate arimax on DCLP3'
