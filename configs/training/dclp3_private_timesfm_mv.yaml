model_data:
  seed: 42
  dataloader:
    history_len: 48
    pred_len: 12
    stride: 12
    batch_size: 128
    shuffle: true
    num_workers: 0
    univariate: false
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
  model:
    name: timesfm
    params:
      context_len: 48
      model_id: google/timesfm-2.5-200m-pytorch
      max_context: 1024
      max_horizon: 256
      normalize_inputs: true
      device: auto
      univariate: false
training:
  epochs: 30
  loss: mse
  optimizer:
    name: adamw
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    name: reduce_on_plateau
    patience: 2
    min_lr: 1.0e-06
  amp: false
  grad_clip: null
  early_stopping:
    enabled: false