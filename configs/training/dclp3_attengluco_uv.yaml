split:
  split_name: dclp3_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  train_part: train
  val_part: val
training:
  epochs: 30
  loss: mse
  amp: false
  grad_clip_norm: 1.0
  compile: false
  early_stopping:
    patience: 5
    min_delta: 0.01
  optimizer:
    name: adam
    lr: 0.001
    weight_decay: 0.0
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    name: reduce_on_plateau
    min_lr: 1.0e-06
    patience: 2
    factor: 0.5
model_data:
  seed: 42
  model:
    name: attengluco
    params:
      d_model: 32
      n_heads: 4
      ff_units: 128
      univariate: true
  dataloader:
    history_len: 48
    pred_len: 12
    stride: 12
    batch_size: 64
    univariate: true
    num_workers: 0
    shuffle: true
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
notes: Univariate attengluco on DCLP3