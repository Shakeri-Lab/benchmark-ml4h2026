split:
  split_name: dclp3_patients_70_10_20_seed42
  split_root: configs/preprocessing
  processed_root: datasets_processed
  train_part: train
  val_part: val
training:
  epochs: 30
  loss: mse
  amp: false
  grad_clip_norm: 1.0
  compile: false
  early_stopping:
    patience: 5
    min_delta: 0.01
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
  scheduler:
    name: reduce_on_plateau
    min_lr: 1.0e-06
    patience: 2
    factor: 0.5
model_data:
  seed: 42
  model:
    name: glimmer
    params:
      variant: transformer
      context_len: 288
      num_blocks: 1
      num_heads: 8
      ff_dim: 256
      dropout: 0.1
      key_dim: 16
      activation: relu
      loss_weights:
      - 1.0
      - 4.0
      - 2.5
      epochs: 30
      batch_size: 48
      learning_rate: 0.001
      optimizer: adam
      univariate: true
      ma_window_size: 200
  dataloader:
    history_len: 487
    pred_len: 12
    stride: 12
    batch_size: 48
    univariate: true
    num_workers: 0
    shuffle: true
    nocturnal_start_hour: 0
    nocturnal_end_hour: 6
notes: Univariate GLIMMER on DCLP3
