model_data:
  dataloader:
    batch_size: 64
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 24
    shuffle: true
    stride: 24
    univariate: false
  model:
    name: patchmlp_glimmer
    params:
      d_model: 512
      e_layers: 2
      output_attention: false
      univariate: false
      use_norm: false
  seed: 42
notes: 'Counterfactual best config: patchmlp_glimmer on action_cf_benchmark; using
  best PatchMLP architecture from 046 with val_rmse=7.713585 and default GLIMMER GA
  settings from existing repo config'
split:
  processed_root: datasets_processed
  split_name: action_cf_benchmark
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  grad_clip_norm: 1.0
  loss: glimmer_weighted
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0005
    name: adamw
    weight_decay: 0.001
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
  loss_params:
    w_hypo: 2.0
    w_hyper: 2.0
    hypo_threshold: 70.0
    hyper_threshold: 180.0
  ga_search:
    enabled: true
    fitness: rmse
    population_size: 12
    generations: 12
    w_hypo_range:
    - 1.0
    - 10.0
    w_hyper_range:
    - 1.0
    - 10.0
    mutation_rate: 1.0
    mutation_scale: 0.7
    selection: uniform
    elite_fraction: 0.33
    inner_epochs: 4
    seed: 42
