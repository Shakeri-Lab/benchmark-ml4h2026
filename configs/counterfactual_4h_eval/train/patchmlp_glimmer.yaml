model_data:
  dataloader:
    batch_size: 64
    feature_cols:
    - cgm
    - basal
    - bolus
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 48
    shuffle: true
    stride: 48
    univariate: false
  model:
    name: patchmlp_glimmer
    params:
      d_model: 512
      e_layers: 2
      output_attention: false
      univariate: false
      use_norm: true
  seed: 42
notes: 'Counterfactual best config: patchmlp_glimmer on action_cf_benchmark_controliq;
  using best PatchMLP architecture from 015 with val_rmse=9.723328 and default GLIMMER
  GA settings from existing repo config'
split:
  processed_root: datasets_processed
  split_name: action_cf_controliq_4h
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  ga_search:
    elite_fraction: 0.33
    enabled: false
    fitness: rmse
    generations: 12
    inner_epochs: 4
    mutation_rate: 1.0
    mutation_scale: 0.7
    population_size: 12
    seed: 42
    selection: uniform
    w_hyper_range:
    - 1.0
    - 10.0
    w_hypo_range:
    - 1.0
    - 10.0
  grad_clip_norm: 1.0
  loss: glimmer_weighted
  loss_params:
    hyper_threshold: 180.0
    hypo_threshold: 70.0
    w_hyper: 2.0
    w_hypo: 2.0
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0005
    name: adamw
    weight_decay: 0.001
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
