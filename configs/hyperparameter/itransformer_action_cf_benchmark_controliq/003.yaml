model_data:
  dataloader:
    batch_size: 128
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 24
    shuffle: false
    stride: 24
    univariate: false
  model:
    name: itransformer
    params:
      activation: gelu
      class_strategy: projection
      d_ff: 256
      d_model: 64
      dropout: 0.1
      e_layers: 2
      embed: timeF
      factor: 1
      freq: h
      n_heads: 4
      output_attention: false
      univariate: false
      use_norm: true
  seed: 42
notes: 'Hyperparameter search: itransformer on action_cf_benchmark_controliq'
split:
  processed_root: datasets_processed
  split_name: action_cf_benchmark_controliq
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  grad_clip_norm: 1.0
  loss: mse
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0001
    name: adamw
    weight_decay: 0.001
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
