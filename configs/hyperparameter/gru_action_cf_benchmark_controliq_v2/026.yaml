model_data:
  dataloader:
    batch_size: 64
    feature_cols:
    - cgm
    - basal
    - bolus
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 24
    shuffle: true
    stride: 24
    univariate: false
  model:
    name: gru
    params:
      bidirectional: true
      dropout: 0.0
      head_hidden_dim: 32
      head_num_layers: 2
      head_type: linear
      hidden_size: 512
      num_layers: 2
      univariate: false
      use_layernorm: true
  seed: 42
notes: GRU CF 2h re-search v2 (h=512,L=2,do=0.0,lr=0.0005,bs=64); original grid hidden_size
  in {16,32} was pinned at its ceiling
split:
  processed_root: datasets_processed
  split_name: action_cf_benchmark_controliq
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  grad_clip_norm: 1.0
  loss: mse
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0005
    name: adamw
    weight_decay: 0.001
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
