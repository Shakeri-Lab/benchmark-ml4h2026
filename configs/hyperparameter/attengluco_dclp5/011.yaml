model_data:
  dataloader:
    batch_size: 64
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 6
    shuffle: true
    stride: 6
    univariate: false
  model:
    name: attengluco
    params:
      d_model: 32
      ff_units: 256
      n_heads: 4
      univariate: false
  seed: 42
notes: 'Hyperparameter search: attengluco on dclp5'
split:
  processed_root: datasets_processed
  split_name: dclp5_patients_70_10_20_seed42
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  grad_clip_norm: 1.0
  loss: mse
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.001
    name: adam
    weight_decay: 0.0001
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
