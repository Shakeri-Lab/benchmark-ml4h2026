model_data:
  dataloader:
    batch_size: 128
    history_len: 288
    nocturnal_end_hour: 6
    nocturnal_start_hour: 0
    num_workers: 0
    pred_len: 6
    shuffle: true
    stride: 59
    univariate: false
  model:
    name: patchmlp
    params:
      d_model: 1024
      e_layers: 1
      output_attention: false
      univariate: false
      use_norm: true
  seed: 42
notes: 'Hyperparameter search: patchmlp on iobp2'
split:
  processed_root: datasets_processed
  split_name: iobp2_patients_70_10_20_seed42
  split_root: configs/preprocessing
  train_part: train
  val_part: val
training:
  amp: false
  compile: false
  early_stopping:
    min_delta: 0.01
    patience: 5
  epochs: 30
  grad_clip_norm: 1.0
  loss: mse
  optimizer:
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    lr: 0.0001
    name: adamw
    weight_decay: 0.0
  scheduler:
    factor: 0.5
    min_lr: 1.0e-06
    name: reduce_on_plateau
    patience: 2
